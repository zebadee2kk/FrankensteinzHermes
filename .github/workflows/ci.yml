name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Validate architecture and machine-readable policy
        run: python scripts/validate_repo.py

      - name: Reject obvious committed private keys
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE -- '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' ':!*.md'; then
            echo 'Private key material detected.' >&2
            exit 1
          fi

# B002 will harden this baseline with dedicated secret/dependency/security scanning
# and pin third-party Actions to reviewed immutable commit SHAs before production autonomy.
