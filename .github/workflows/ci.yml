name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Compile validation scripts
        run: python -m compileall -q scripts

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find bootstrap scripts -type f -name '*.sh' -print0 2>/dev/null)

      - name: Validate Compose runtime contract
        shell: bash
        run: bash scripts/compose/verify.sh

      - name: Validate architecture and machine-readable policy
        run: python scripts/validate_repo.py

      - name: Reject obvious committed private keys
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE -- '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' ':!*.md'; then
            echo 'Private key material detected.' >&2
            exit 1
          fi

  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: TruffleHog verified/unknown secret scan
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          version: '3.97.4'
          extra_args: --results=verified,unknown

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  postgres-contract:
    name: postgres-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create ephemeral database secret and paths
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/fzh-secrets/postgres_password"
          backup_dir="$RUNNER_TEMP/fzh-backups"
          install -d -m 0700 "$(dirname "$secret_file")" "$backup_dir"
          openssl rand -base64 36 > "$secret_file"
          chmod 0600 "$secret_file"
          echo "FZH_POSTGRES_PASSWORD_FILE=$secret_file" >> "$GITHUB_ENV"
          echo "FZH_BACKUP_DIR=$backup_dir" >> "$GITHUB_ENV"

      - name: Start PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/compose/compose.yaml up -d postgres
          for _ in $(seq 1 60); do
            if docker compose -f deploy/compose/compose.yaml exec -T postgres \
              pg_isready --username=frankensteinz --dbname=frankensteinz >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f deploy/compose/compose.yaml logs postgres
          exit 1

      - name: Apply migrations twice to prove idempotency
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/postgres/migrate.sh
          bash scripts/postgres/migrate.sh

      - name: Create validated backup
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          backup_path="$(bash scripts/postgres/backup.sh)"
          test -s "$backup_path"
          echo "path=$backup_path" >> "$GITHUB_OUTPUT"

      - name: Restore backup into disposable PostgreSQL
        shell: bash
        run: bash scripts/postgres/restore-test.sh "${{ steps.backup.outputs.path }}"

      - name: Tear down CI database state
        if: always()
        shell: bash
        run: docker compose -f deploy/compose/compose.yaml --profile restore-test down -v --remove-orphans
