name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Compile validation scripts
        run: python -m compileall -q scripts tests

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find bootstrap scripts -type f -name '*.sh' -print0 2>/dev/null)

      - name: Validate Compose runtime contract
        shell: bash
        run: bash scripts/compose/verify.sh

      - name: Validate architecture and machine-readable policy
        run: python scripts/validate_repo.py

      - name: Reject obvious committed private keys
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE -- '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' ':!*.md'; then
            echo 'Private key material detected.' >&2
            exit 1
          fi

  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog verified/unknown secret scan
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          version: '3.97.4'
          extra_args: --results=verified,unknown

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  governor-contract:
    name: governor-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install policy parser
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Run governor contract tests
        run: python -m unittest -v tests.test_governor

  litellm-contract:
    name: litellm-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create ephemeral LiteLLM master key file
        shell: bash
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/litellm.env"
          printf 'LITELLM_MASTER_KEY=%s\n' "sk-$(openssl rand -hex 32)" > "$env_file"
          chmod 0600 "$env_file"
          echo "FZH_LITELLM_ENV_FILE=$env_file" >> "$GITHUB_ENV"
          echo "FZH_LITELLM_PORT=14000" >> "$GITHUB_ENV"
      - name: Start loopback-only LiteLLM gateway
        shell: bash
        run: docker compose -f deploy/compose/compose.yaml up -d litellm
      - name: Verify health and loopback binding
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for _ in $(seq 1 90); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:14000/health/liveliness >/dev/null 2>&1; then
              ok=true
              break
            fi
            sleep 1
          done
          if [[ "$ok" != true ]]; then
            docker compose -f deploy/compose/compose.yaml ps
            docker compose -f deploy/compose/compose.yaml logs litellm
            exit 1
          fi
          published="$(docker compose -f deploy/compose/compose.yaml port litellm 4000)"
          [[ "$published" == 127.0.0.1:* ]] || { echo "LiteLLM not loopback-only: $published" >&2; exit 1; }
      - name: Tear down LiteLLM contract state
        if: always()
        shell: bash
        run: docker compose -f deploy/compose/compose.yaml down -v --remove-orphans

  postgres-contract:
    name: postgres-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create ephemeral database secret and paths
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/fzh-secrets/postgres_password"
          backup_dir="$RUNNER_TEMP/fzh-backups"
          install -d -m 0700 "$(dirname "$secret_file")" "$backup_dir"
          openssl rand -base64 36 > "$secret_file"
          chmod 0600 "$secret_file"
          echo "FZH_POSTGRES_PASSWORD_FILE=$secret_file" >> "$GITHUB_ENV"
          echo "FZH_BACKUP_DIR=$backup_dir" >> "$GITHUB_ENV"

      - name: Start PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/compose/compose.yaml up -d postgres
          for _ in $(seq 1 60); do
            if docker compose -f deploy/compose/compose.yaml exec -T postgres \
              pg_isready --username=frankensteinz --dbname=frankensteinz >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f deploy/compose/compose.yaml logs postgres
          exit 1

      - name: Apply migrations twice to prove idempotency
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/postgres/migrate.sh
          bash scripts/postgres/migrate.sh

      - name: Create validated backup
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          backup_path="$(bash scripts/postgres/backup.sh)"
          test -s "$backup_path"
          echo "path=$backup_path" >> "$GITHUB_OUTPUT"

      - name: Restore backup into disposable PostgreSQL
        shell: bash
        run: bash scripts/postgres/restore-test.sh "${{ steps.backup.outputs.path }}"

      - name: Tear down CI database state
        if: always()
        shell: bash
        run: docker compose -f deploy/compose/compose.yaml --profile restore-test down -v --remove-orphans

  observability-contract:
    name: observability-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create ephemeral textfile metrics directory
        shell: bash
        run: |
          set -euo pipefail
          textfile_dir="$RUNNER_TEMP/fzh-textfile"
          install -d -m 0755 "$textfile_dir"
          cat > "$textfile_dir/frankensteinz.prom" <<'EOF'
          # TYPE fzh_health_snapshot_timestamp_seconds gauge
          fzh_health_snapshot_timestamp_seconds 1
          EOF
          echo "FZH_TEXTFILE_DIR=$textfile_dir" >> "$GITHUB_ENV"

      - name: Validate Prometheus configuration and rules
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint=/bin/promtool \
            -v "$PWD/deploy/compose/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.14.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint=/bin/promtool \
            -v "$PWD/deploy/compose/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.14.0 \
            check rules /etc/prometheus/rules/seed-alerts.yml

      - name: Start internal observability pair
        shell: bash
        run: docker compose -f deploy/compose/compose.yaml up -d node-exporter prometheus

      - name: Verify Prometheus scrapes node exporter and textfile metrics
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for _ in $(seq 1 60); do
            if docker compose -f deploy/compose/compose.yaml exec -T prometheus \
              promtool query instant http://localhost:9090 'up{job="node"}' 2>/dev/null | grep -q '=> 1'; then
              ok=true
              break
            fi
            sleep 1
          done
          if [[ "$ok" != true ]]; then
            docker compose -f deploy/compose/compose.yaml ps
            docker compose -f deploy/compose/compose.yaml logs prometheus node-exporter
            exit 1
          fi
          docker compose -f deploy/compose/compose.yaml exec -T prometheus \
            promtool query instant http://localhost:9090 'fzh_health_snapshot_timestamp_seconds' | grep -q '=> 1'

      - name: Tear down observability test state
        if: always()
        shell: bash
        run: docker compose -f deploy/compose/compose.yaml down -v --remove-orphans
