name: engineering QA contract

on:
  pull_request:
    paths:
      - 'scripts/engineering_qa/**'
      - 'scripts/validate_engineering_qa.py'
      - 'config/engineering-qa.example.json'
      - 'config/qa-profiles.example.json'
      - 'db/migrations/0008_b034_qa_api.sql'
      - 'tests/test_engineering_qa.py'
      - 'tests/sql/b034_qa_privilege_contract.sql'
      - 'tests/helpers/fake_engineering_qa_*'
      - 'docs/operations/ENGINEERING-QA.md'
      - '.github/workflows/engineering-qa-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/engineering_qa/**'
      - 'scripts/validate_engineering_qa.py'
      - 'config/engineering-qa.example.json'
      - 'config/qa-profiles.example.json'
      - 'db/migrations/0008_b034_qa_api.sql'
      - 'tests/test_engineering_qa.py'
      - 'tests/sql/b034_qa_privilege_contract.sql'
      - 'tests/helpers/fake_engineering_qa_*'
      - 'docs/operations/ENGINEERING-QA.md'
      - '.github/workflows/engineering-qa-contract.yml'

permissions:
  contents: read

jobs:
  engineering-qa-contract:
    name: engineering-qa-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Compile QA and contract sources
        run: python -m compileall -q scripts/engineering_qa scripts/validate_engineering_qa.py tests/test_engineering_qa.py tests/helpers

      - name: Validate shell helper syntax
        run: bash -n scripts/engineering_qa/install_sandbox.sh

      - name: Validate static QA authority invariants
        run: python scripts/validate_engineering_qa.py

      - name: Run adversarial QA coordinator tests
        run: python -m unittest -v tests.test_engineering_qa

      - name: Create ephemeral PostgreSQL secret
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/fzh-secrets/postgres_password"
          install -d -m 0700 "$(dirname "$secret_file")"
          openssl rand -base64 36 > "$secret_file"
          chmod 0600 "$secret_file"
          echo "FZH_POSTGRES_PASSWORD_FILE=$secret_file" >> "$GITHUB_ENV"

      - name: Start PostgreSQL and apply migrations twice
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -f deploy/compose/compose.yaml)
          "${compose[@]}" up -d postgres
          ready=0
          for _ in $(seq 1 60); do
            if "${compose[@]}" exec -T postgres pg_isready --username=frankensteinz --dbname=frankensteinz >/dev/null 2>&1; then
              ready=$((ready + 1))
              if [[ "$ready" -ge 2 ]]; then break; fi
            else
              ready=0
            fi
            sleep 1
          done
          [[ "$ready" -ge 2 ]]
          bash scripts/postgres/migrate.sh
          bash scripts/postgres/migrate.sh

      - name: Prove B034 cannot bypass QA capability API
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -f deploy/compose/compose.yaml)
          if "${compose[@]}" exec -T postgres psql --set=ON_ERROR_STOP=1 --username=frankensteinz --dbname=frankensteinz \
            --command="SET ROLE fzh_b034_qa; SELECT count(*) FROM fzh.jobs;"; then
            echo 'B034 QA unexpectedly read fzh.jobs directly' >&2
            exit 1
          fi
          if "${compose[@]}" exec -T postgres psql --set=ON_ERROR_STOP=1 --username=frankensteinz --dbname=frankensteinz \
            --command="SET ROLE fzh_b034_qa; SELECT * FROM fzh.lease_next_job('bypass',300,'engineering.qa');"; then
            echo 'B034 QA unexpectedly executed generic lease_next_job' >&2
            exit 1
          fi
          if "${compose[@]}" exec -T postgres psql --set=ON_ERROR_STOP=1 --username=frankensteinz --dbname=frankensteinz \
            --command="SET ROLE fzh_b034_qa; SELECT fzh.b032_begin_candidate_effect('11111111-1111-4111-8111-111111111111'::uuid,'22222222-2222-4222-8222-222222222222'::uuid);"; then
            echo 'B034 QA unexpectedly executed B032 candidate-effect capability' >&2
            exit 1
          fi
          if "${compose[@]}" exec -T postgres psql --set=ON_ERROR_STOP=1 --username=frankensteinz --dbname=frankensteinz \
            --command="SET ROLE fzh_b034_qa; SELECT fzh.b033_start_job('11111111-1111-4111-8111-111111111111'::uuid,'22222222-2222-4222-8222-222222222222'::uuid);"; then
            echo 'B034 QA unexpectedly executed B033 reviewer capability' >&2
            exit 1
          fi

      - name: Exercise scoped B034 QA lifecycle
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/compose/compose.yaml exec -T postgres \
            psql --set=ON_ERROR_STOP=1 --username=frankensteinz --dbname=frankensteinz \
            < tests/sql/b034_qa_privilege_contract.sql

      - name: Confirm contract never contacted a provider
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "${FZH_LITELLM_API_KEY:-}" ]]

      - name: Tear down QA contract state
        if: always()
        shell: bash
        run: docker compose -f deploy/compose/compose.yaml down -v --remove-orphans
