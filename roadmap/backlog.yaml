      - findings stored with candidate evidence

  - id: B034
    title: QA adversarial worker
    phase: 3
    priority: P0
    depends_on: [B032]
    risk: L0
    acceptance:
      - tests acceptance criteria and failure paths
      - can block promotion

  - id: B035
    title: Security reviewer
    phase: 3
    priority: P0
    depends_on: [B032]
    risk: L0
    acceptance:
      - scans secrets/dependencies/permissions/exposure
      - can block promotion

  - id: B036
    title: Release and rollback worker
    phase: 3
    priority: P0
    depends_on: [B033, B034, B035]
    risk: L2
    acceptance:
      - staging deployment automated
      - verification evidence produced
      - rollback to last-known-good tested

  - id: B037
    title: Autonomous backlog selector
    phase: 3
    priority: P0
    depends_on: [B036]
    risk: L1
    acceptance:
      - selects only dependency-unblocked items
      - respects autonomy/risk class
      - produces owner exception queue rather than routine prompts

