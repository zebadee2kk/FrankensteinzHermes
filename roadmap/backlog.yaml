version: 1
project: FrankensteinzHermes
selection_policy: earliest_unblocked_highest_priority

items:
  - id: B001
    title: Repository governance
    phase: 0
    priority: P0
    depends_on: [B002, B003]
    risk: L2
    autonomy: human_gate
    acceptance:
      - protected production branch/ruleset defined
      - required CI checks identified
      - ordinary engineering identity cannot disable governance
      - governance bypass test recorded

  - id: B002
    title: CI baseline
    phase: 0
    priority: P0
    depends_on: [B003]
    risk: L1
    acceptance:
      - lint/test workflow runs on PR
      - secret scan enabled
      - dependency/security checks have documented fail policy
      - third-party actions pinned to immutable commits

  - id: B003
    title: Architecture constitution
    phase: 0
    priority: P0
    depends_on: []
    risk: L2
    autonomy: human_gate
    acceptance:
      - architecture documented
      - autonomy constitution documented
      - threat model documented
      - state ownership documented
      - model routing documented

  - id: B004
    title: Release evidence format
    phase: 0
    priority: P0
    depends_on: [B002, B003]
    risk: L1
    acceptance:
      - candidate version identifiable
      - tests/reviews recorded
      - baseline comparison field exists
      - rollback method recorded

  - id: B010
    title: Ubuntu seed-host bootstrap
    phase: 1
    priority: P0
    depends_on: [B001, B004]
    risk: L2
    acceptance:
      - idempotent bootstrap on Ubuntu LTS
      - no secrets committed
      - host firewall and SSH baseline checked
      - reboot leaves core services recoverable

  - id: B011
    title: Docker Compose runtime
    phase: 1
    priority: P0
    depends_on: [B010]
    risk: L1
    acceptance:
      - compose validation passes
      - services use pinned versions
      - healthchecks present
      - untrusted workers do not receive Docker socket

  - id: B012
    title: PostgreSQL durable state
    phase: 1
    priority: P0
    depends_on: [B011]
    risk: L2
    acceptance:
      - migrations automated
      - backup succeeds
      - isolated restore test succeeds

  - id: B013
    title: Basic observability
    phase: 1
    priority: P0
    depends_on: [B011]
    risk: L1
    acceptance:
      - core health visible
      - structured logs available
      - disk/RAM/service failure alerts defined

  - id: B014
    title: Seed resource governor
    phase: 1
    priority: P0
    depends_on: [B013]
    risk: L1
    acceptance:
      - concurrency limits enforced
      - work pauses under memory/disk pressure
      - core services protected from heavy workers

  - id: B020
    title: Hermes deployment
    phase: 2
    priority: P0
    depends_on: [B012, B013, B014]
    risk: L1
    acceptance:
      - Hermes starts automatically
      - no direct production admin credential
      - healthcheck and logs available

  - id: B021
    title: LiteLLM private gateway
    phase: 2
    priority: P0
    depends_on: [B020]
    risk: L2
    acceptance:
      - private-only endpoint
      - unused privileged features disabled
      - provider credentials not exposed to Hermes workers

  - id: B022
    title: OpenRouter free-first routing
    phase: 2
    priority: P0
    depends_on: [B021]
    risk: L1
    acceptance:
      - explicit free candidate supported
      - free router fallback supported
      - provider exhaustion queues rather than loops indefinitely

  - id: B023
    title: Additional approved free providers
    phase: 2
    priority: P1
    depends_on: [B021]
    risk: L2
    acceptance:
      - privacy/data policy recorded per provider
      - provider can be disabled independently

  - id: B024
    title: Ollama degraded mode
    phase: 2
    priority: P0
    depends_on: [B014]
    risk: L1
    acceptance:
      - local inference works without Internet
      - core services remain responsive while model is loaded

  - id: B025
    title: llmfit hardware/model benchmark
    phase: 2
    priority: P1
    depends_on: [B024]
    risk: L0
    acceptance:
      - actual XPS inventory recorded
      - candidate local models benchmarked
      - recommended local roles registered

  - id: B026
    title: Model evaluation registry
    phase: 2
    priority: P1
    depends_on: [B022, B024]
    risk: L1
    acceptance:
      - quality/latency/reliability results persisted
      - router can rank only policy-eligible candidates

  - id: B030
    title: Action Gate v1
    phase: 3
    priority: P0
    depends_on: [B012, B020]
    risk: L3
    autonomy: human_gate
    acceptance:
      - L0-L3 decisions deterministic
      - allow/deny/approval decisions audited
      - Hermes cannot change gate policy through normal runtime credentials
      - kill switch tested

  - id: B031
    title: Autonomous job ledger
    phase: 3
    priority: P0
    depends_on: [B012, B030]
    risk: L1
    acceptance:
      - every job has stable ID and status
      - retry budget persisted
      - interrupted jobs never silently duplicate side effects

  - id: B032
    title: Engineering implementation worker
    phase: 3
    priority: P0
    depends_on: [B022, B030, B031]
    risk: L1
    acceptance:
      - creates branch not direct production edit
      - finite model/tool/time budgets enforced

  - id: B033
    title: Independent reviewer
    phase: 3
    priority: P0
    depends_on: [B032]
    risk: L0
    acceptance:
