name: frankensteinzhermes

services:
  seed-canary:
    image: busybox:1.37.0
    command: ["sh", "-c", "touch /tmp/ready && exec sleep 86400"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 32m
    cpus: 0.10
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - internal

networks:
  internal:
    name: frankensteinzhermes-internal
    internal: true
